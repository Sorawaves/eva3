# ═══════════════════════════════════════════════════════════════
# CONFIGURACIÓN NGINX PARA AWS EC2 - INSTANCIA WEB
# ═══════════════════════════════════════════════════════════════
# 
# Este archivo debe copiarse a:
# /etc/nginx/sites-available/logistica
#
# Luego crear symlink:
# sudo ln -s /etc/nginx/sites-available/logistica /etc/nginx/sites-enabled/
#
# ═══════════════════════════════════════════════════════════════

upstream django_app {
    # Gunicorn escucha en un socket Unix (más eficiente que puerto TCP)
    server unix:/var/www/html/logistica/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    
    # IMPORTANTE: Reemplazar con tu dominio DuckDNS y la IP pública
    server_name <TU_DOMINIO>.duckdns.org <IP_PUBLICA_INSTANCIA_WEB>;
    # Ejemplo: server_name logistica-global.duckdns.org 54.123.45.67;
    
    client_max_body_size 10M;
    
    # Logs
    access_log /var/log/nginx/logistica-access.log;
    error_log /var/log/nginx/logistica-error.log;
    
    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
    
    # Archivos estáticos
    location /static/ {
        alias /var/www/html/logistica/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Archivos media
    location /media/ {
        alias /var/www/html/logistica/media/;
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # Proxy a Django/Gunicorn
    location / {
        proxy_pass http://django_app;
        
        # Headers importantes
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffers
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

# ═══════════════════════════════════════════════════════════════
# CONFIGURACIÓN HTTPS (después de instalar Let's Encrypt)
# ═══════════════════════════════════════════════════════════════
# Certbot agregará automáticamente la configuración SSL aquí
# cuando ejecutes: sudo certbot --nginx -d tu-dominio.duckdns.org
