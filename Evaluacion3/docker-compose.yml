version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════
  # INSTANCIA 2: Base de Datos PostgreSQL
  # Simula la segunda instancia EC2
  # ═══════════════════════════════════════════════════════════════
  db:
    image: postgres:14-alpine
    container_name: logistica-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: logistica_db
      POSTGRES_USER: logistica_user
      POSTGRES_PASSWORD: LogisticaSecure2025!
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=es_CL.UTF-8 --lc-ctype=es_CL.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - logistica_network
    ports:
      - "5432:5432"  # Solo para debugging, en producción NO exponer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistica_user -d logistica_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════
  # INSTANCIA 1: Servidor Web Django
  # Simula la primera instancia EC2 con Django + Gunicorn
  # ═══════════════════════════════════════════════════════════════
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistica-web
    restart: unless-stopped
    command: >
      sh -c "
        echo '⏳ Esperando a PostgreSQL...' &&
        while ! nc -z db 5432; do sleep 1; done &&
        echo '✅ PostgreSQL listo!' &&
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        python load_data.py &&
        echo '🚀 Iniciando Gunicorn...' &&
        gunicorn --workers 3 --bind 0.0.0.0:8000 logistica.wsgi:application
      "
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=logistica_db
      - DB_USER=logistica_user
      - DB_PASSWORD=LogisticaSecure2025!
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=django-insecure-docker-compose-key-change-in-production
    volumes:
      - ./:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - logistica_network
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ═══════════════════════════════════════════════════════════════
  # NGINX (Opcional): Reverse Proxy
  # Simula Nginx en instancia web
  # ═══════════════════════════════════════════════════════════════
  nginx:
    image: nginx:alpine
    container_name: logistica-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/staticfiles:ro
      - media_volume:/var/www/media:ro
    networks:
      - logistica_network
    depends_on:
      - web

networks:
  logistica_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
